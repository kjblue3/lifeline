<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LastLine MVP</title>
<style>body{font-family:system-ui;margin:0;background:#101827;color:#eef2ff}main{max-width:920px;margin:40px auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}section{background:#1c2940;padding:20px;border-radius:14px;margin:20px 0}button,textarea{font:inherit;border-radius:8px;padding:10px}button{cursor:pointer;border:0;background:#67e8f9;color:#07111f;margin:5px}textarea{box-sizing:border-box;width:100%;min-height:90px;background:#101827;color:white;border:1px solid #52627d}.row{padding:12px;border-bottom:1px solid #52627d}.muted{color:#b9c5db}strong{color:#67e8f9}</style></head><body><main><header><div><h1>LastLine</h1><p class="muted">Emergency report resilience prototype</p></div><h2 id="mode">Loading…</h2></header>
<section><div id="metrics"></div><button onclick="network(false)">Simulate outage</button><button onclick="network(true)">Restore simulated cloud</button><button onclick="sync()">Sync pending</button></section>
<section><h2>New emergency report</h2><textarea id="text">Three people trapped in a flooded building</textarea><p><button onclick="submitReport()">Submit report</button></p><p id="message" class="muted"></p></section>
<section><h2>Incoming reports</h2><div id="reports"></div></section>
<p class="muted">Demo mode: offline classification uses keyword rules; cloud and synchronization are simulated locally until integrated.</p></main>
<script>const API='http://127.0.0.1:8000';async function request(path,opts){const r=await fetch(API+path,opts);if(!r.ok)throw Error(await r.text());return r.json()}
async function refresh(){try{const s=await request('/status');document.getElementById('mode').textContent=s.cloud_available_simulated?'🟢 CLOUD AVAILABLE':'🔴 CLOUD UNAVAILABLE';document.getElementById('metrics').textContent=`Engine: ${s.inference_engine} | Total: ${s.total_reports} | Pending sync: ${s.pending_sync}`;const data=await request('/reports');document.getElementById('reports').innerHTML='';for(const x of data){const div=document.createElement('div');div.className='row';const b=document.createElement('strong');b.textContent=`${x.urgency.toUpperCase()} · ${x.category}`;div.append(b,document.createElement('br'),document.createTextNode(x.text),document.createElement('br'),document.createTextNode(x.synced?'Synced (simulated)':'Pending sync'));document.getElementById('reports').appendChild(div)}}catch(e){document.getElementById('message').textContent=e.message}}
async function submitReport(){try{await request('/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('text').value})});await refresh()}catch(e){alert(e.message)}}
async function network(online){await request('/demo/network',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({online})});await refresh()}
async function sync(){try{await request('/sync',{method:'POST'});await refresh()}catch(e){alert(e.message)}}refresh();setInterval(refresh,2500)</script></body></html>
